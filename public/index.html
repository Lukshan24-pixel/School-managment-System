
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>System Login - School Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eaf2ff, #f8fbff);
            color: #183153;
            overflow-x: hidden;
        }

        .scene {
            min-height: 100vh;
            max-width: 1200px;
            margin: auto;
            padding: 30px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 45px;
        }

        /* Background */

        .background-circle {
            position: absolute;
            width: 380px;
            height: 380px;
            background: #dceaff;
            border-radius: 50%;
            top: 12%;
            left: 7%;
            opacity: 0.7;
        }

        .floor {
            position: absolute;
            bottom: 75px;
            left: 4%;
            right: 4%;
            height: 3px;
            background: #cbd8eb;
        }

        /* Professional Businessman */

        .person {
            position: absolute;
            z-index: 2;
            width: 210px;
            height: 340px;
            left: -240px;
            bottom: 78px;
            animation: walkIn 2.5s ease-in-out forwards;
        }

        .person svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .leg-left {
            transform-box: fill-box;
            transform-origin: 50% 0%;
            animation: walkLeg 0.42s ease-in-out 6;
        }

        .leg-right {
            transform-box: fill-box;
            transform-origin: 50% 0%;
            animation: walkLegReverse 0.42s ease-in-out 6;
        }

        .arm-left {
            transform-box: fill-box;
            transform-origin: 50% 0%;
            animation: armSwing 0.42s ease-in-out 6;
        }

        /* Suitcase Being Carried */

        .carried-case {
            transform-box: fill-box;
            transform-origin: 50% 0%;
            animation: carryCase 2.5s ease-in-out forwards;
        }

        /* Suitcase On The Floor */

        .dropped-case {
            position: absolute;
            z-index: 3;
            width: 125px;
            height: 90px;
            left: 34%;
            bottom: 77px;
            opacity: 0;
            transform: translateY(-90px) rotate(-8deg);
            animation: dropCase 0.8s ease-out 2.5s forwards;
        }

        .case-handle {
            position: absolute;
            top: -17px;
            left: 40px;
            width: 42px;
            height: 22px;
            border: 6px solid #233c5b;
            border-bottom: 0;
            border-radius: 8px 8px 0 0;
        }

        .case-body {
            position: absolute;
            inset: 0;
            background: #315b85;
            border: 4px solid #203d5c;
            border-radius: 9px;
            overflow: hidden;
        }

        .case-detail {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 21px;
            width: 4px;
            background: rgba(255,255,255,0.15);
        }

        .case-detail.right {
            left: auto;
            right: 21px;
        }

        .case-lock {
            position: absolute;
            left: 53px;
            top: 32px;
            width: 13px;
            height: 19px;
            background: #dbeafe;
            border-radius: 3px;
        }

        .case-lid {
            position: absolute;
            z-index: 2;
            top: 0;
            left: 0;
            width: 125px;
            height: 38px;
            background: #4778a5;
            border: 4px solid #203d5c;
            border-radius: 8px 8px 3px 3px;
            transform-origin: top center;
        }

        body.started .case-lid {
            animation: openLid 0.8s ease 3.25s forwards;
        }

        .dropped-case::after {
            content: "";
            position: absolute;
            z-index: -1;
            width: 160px;
            height: 160px;
            left: -18px;
            top: -30px;
            border-radius: 50%;
            background: rgba(96, 165, 250, 0.18);
            opacity: 0;
            animation: suitcaseGlow 1s ease 3.3s forwards;
        }

        /* Login Card */

        .login-card {
            position: relative;
            z-index: 5;
            width: 380px;
            flex-shrink: 0;
            margin-left: 330px;
            padding: 32px;
            background: #ffffff;
            border: 1px solid #e0e9f6;
            border-radius: 18px;
            box-shadow: 0 18px 55px rgba(27, 63, 110, 0.14);

            opacity: 0;
            transform: translateY(35px) scale(0.94);
            pointer-events: none;

            animation: revealLogin 0.8s ease-out 4s forwards;
        }

        .login-icon {
            width: 58px;
            height: 58px;
            margin: 0 auto 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 16px;
            background: #eaf2ff;
            color: #2563eb;
            font-size: 27px;
        }

        h1 {
            text-align: center;
            font-size: 25px;
            margin: 0 0 9px;
        }

        .subtitle {
            text-align: center;
            color: #718096;
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 26px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: bold;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d7e0ed;
            border-radius: 9px;
            outline: none;
            font-size: 14px;
            background: white;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
        }

        .btn {
            width: 100%;
            padding: 13px;
            background: #2563eb;
            border: none;
            border-radius: 9px;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #1d4ed8;
        }

        .btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .message {
            color: #b91c1c;
            font-size: 13px;
            text-align: center;
            line-height: 1.5;
        }

        .note {
            margin-top: 19px;
            color: #94a3b8;
            font-size: 11px;
            line-height: 1.6;
            text-align: center;
        }

        .replay {
            position: absolute;
            z-index: 10;
            bottom: 22px;
            right: 30px;
            border: 1px solid #d8e5f7;
            border-radius: 8px;
            background: white;
            color: #2563eb;
            padding: 11px 15px;
            cursor: pointer;
        }

        /* Animations */

        @keyframes walkIn {
            0% {
                left: -240px;
            }

            75% {
                left: 15%;
            }

            100% {
                left: 15%;
            }
        }

        @keyframes walkLeg {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(17deg); }
        }

        @keyframes walkLegReverse {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-17deg); }
        }

        @keyframes armSwing {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-9deg); }
        }

        @keyframes carryCase {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-5deg); }
        }

        @keyframes dropCase {
            0% {
                opacity: 0;
                transform: translateY(-90px) rotate(-8deg);
            }

            70% {
                opacity: 1;
                transform: translateY(8px) rotate(3deg);
            }

            85% {
                transform: translateY(-4px) rotate(-2deg);
            }

            100% {
                opacity: 1;
                transform: translateY(0) rotate(0);
            }
        }

        @keyframes openLid {
            to {
                transform: perspective(250px) rotateX(125deg);
            }
        }

        @keyframes suitcaseGlow {
            to {
                opacity: 1;
            }
        }

        @keyframes revealLogin {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
                pointer-events: auto;
            }
        }

        /* Responsive Design */

        @media (max-width: 900px) {
            .scene {
                min-height: 900px;
                padding: 30px 18px 80px;
                flex-direction: column;
                justify-content: flex-end;
                gap: 20px;
            }

            .background-circle {
                width: 250px;
                height: 250px;
                top: 30px;
                left: 50%;
                transform: translateX(-50%);
            }

            .person {
                width: 165px;
                height: 270px;
                bottom: auto;
                top: 25px;
                animation-name: walkInMobile;
            }

            .floor {
                top: 305px;
                bottom: auto;
            }

            .dropped-case {
                width: 105px;
                height: 75px;
                top: 235px;
                bottom: auto;
                left: calc(50% - 52px);
            }

            .case-handle {
                left: 33px;
            }

            .case-lid {
                width: 105px;
            }

            .case-lock {
                left: 44px;
                top: 25px;
            }

            .login-card {
                width: 100%;
                max-width: 380px;
                margin: 0;
                padding: 27px;
                animation-delay: 4s;
            }

            @keyframes walkInMobile {
                from { left: -190px; }
                to { left: calc(50% - 190px); }
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .person,
            .leg-left,
            .leg-right,
            .arm-left,
            .carried-case,
            .dropped-case,
            .login-card,
            body.started .case-lid {
                animation: none !important;
            }

            .person {
                left: 15%;
            }

            .dropped-case {
                opacity: 1;
                transform: none;
            }

            .login-card {
                opacity: 1;
                transform: none;
                pointer-events: auto;
            }
        }
    </style>
</head>

    <script>
        const loginForm = document.getElementById('login-form');
        const loginButton = document.getElementById('login-button');
        const message = document.getElementById('message');

        // Replay The Full Animation
        document.getElementById('replay').addEventListener('click', () => {
            window.location.reload();
        });

        // Login Using The Existing Backend API
        loginForm.addEventListener('submit', async function(event) {
            event.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            message.textContent = '';
            loginButton.disabled = true;
            loginButton.textContent = 'Logging In...';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json().catch(() => ({}));

                if (response.ok) {
                    window.location.href = 'dashboard.html';
                } else {
                    message.textContent =
                        data.error || 'Login Failed. Check Your Details.';
                }

            } catch (error) {
                console.error('Login Error:', error);

                message.textContent =
                    'Unable To Connect To The Server. Please Try Again.';
            } finally {
                loginButton.disabled = false;
                loginButton.textContent = 'Login';
            }
        });
    </script>
